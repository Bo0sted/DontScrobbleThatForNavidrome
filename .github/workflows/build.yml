name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up TinyGo
        uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: "0.41.1"

      - name: Test
        run: go test -race ./...

      - name: Build and package
        run: make package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: navidrome-lastfm-exclusion.ndp
          path: navidrome-lastfm-exclusion.ndp
